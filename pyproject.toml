[project]
name = "pr-sentinel"
version = "1.4.0"
description = "PR quality gate — Phase9/1.4.0 live readiness docs (M34–M36 + this release; real App e2e optional, not a hard gate)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "arq>=0.26.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",
    "pathspec>=0.12.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis[lua]>=2.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/github/pr_sentinel_github"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "apps/api", "apps/worker", "packages/github", "packages"]
# M22: silence Starlette TestClient deprecation noise (keep sync TestClient; no prod httpx2)
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis[lua]>=2.23.0",
]
