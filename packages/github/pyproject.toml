[project]
name = "pr-sentinel-github"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0", "PyJWT>=2.8.0", "cryptography>=42.0.0", "PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pr_sentinel_github"]
