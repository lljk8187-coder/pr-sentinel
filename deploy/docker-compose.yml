# PR Sentinel M5 — api (console) + arq worker + redis + postgres (jobs)
#   docker compose -f deploy/docker-compose.yml --env-file .env up --build
#   curl http://localhost:8000/health
#   open http://localhost:8000/console

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prsentinel
      POSTGRES_PASSWORD: prsentinel
      POSTGRES_DB: prsentinel
    ports:
      - "5432:5432"
    volumes:
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prsentinel -d prsentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://prsentinel:prsentinel@postgres:5432/prsentinel
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev-secret}
      WEBHOOK_SKIP_VERIFY: ${WEBHOOK_SKIP_VERIFY:-false}
      USE_FIXTURES: ${USE_FIXTURES:-true}
      FIXTURES_DIR: /app/tests/fixtures
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PR_SENTINEL_OPENAI_API_KEY: ${PR_SENTINEL_OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      LOG_LEVEL: INFO
    # Optional PEM bind for live App auth:
    #   GITHUB_APP_PRIVATE_KEY_PATH=/secrets/github-app.pem
    #   GITHUB_APP_PEM_HOST_PATH=./app.pem
    # volumes:
    #   - ${GITHUB_APP_PEM_HOST_PATH}:/secrets/github-app.pem:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://prsentinel:prsentinel@postgres:5432/prsentinel
      USE_FIXTURES: ${USE_FIXTURES:-true}
      FIXTURES_DIR: /app/tests/fixtures
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PR_SENTINEL_OPENAI_API_KEY: ${PR_SENTINEL_OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      LOG_LEVEL: INFO
    # Optional PEM bind (uncomment for live App auth via file):
    # volumes:
    #   - ${GITHUB_APP_PEM_HOST_PATH}:/secrets/github-app.pem:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Process-level: PID 1 must still be `python apps/worker/main.py` (arq). No HTTP server.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pathlib; c = pathlib.Path('/proc/1/cmdline').read_bytes(); assert b'apps/worker/main.py' in c or b'arq' in c",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
