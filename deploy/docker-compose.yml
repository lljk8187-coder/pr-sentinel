# PR Sentinel M1 — api + arq worker + redis + postgres (placeholder)
#   docker compose -f deploy/docker-compose.yml up --build
#   curl http://localhost:8000/health

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prsentinel
      POSTGRES_PASSWORD: prsentinel
      POSTGRES_DB: prsentinel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prsentinel -d prsentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
    # M1: empty DB placeholder; API does not connect yet

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev-secret}
      WEBHOOK_SKIP_VERIFY: ${WEBHOOK_SKIP_VERIFY:-false}
      USE_FIXTURES: ${USE_FIXTURES:-true}
      FIXTURES_DIR: /app/tests/fixtures
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      USE_FIXTURES: ${USE_FIXTURES:-true}
      FIXTURES_DIR: /app/tests/fixtures
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
