version: 1
summary_comment: true
update_strategy: update
ignore_paths:
  - "docs/**"
  - "**/*.md"
diff:
  max_pages: 5
  per_page: 100
  max_files: 300
rules:
  secrets:
    enabled: true
  large_files:
    enabled: true
    max_bytes: 500
  weakened_tests:
    enabled: true
analyzer:
  mode: rules
